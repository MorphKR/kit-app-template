[package]
# Semantic Versionning is used: https://semver.org/
version = "0.1.0"

# Lists people or organizations that are considered the "authors" of the package.
authors = ["NVIDIA"]

# The title and description fields are primarly for displaying extension info in UI
title = "Morph Section Tool"
description="A section tool window"

# Path (relative to the root) or content of readme markdown file for UI.
readme  = "docs/README.md"

# URL of the extension source repository.
repository = ""

category = "Other"

# Preview image and icon. Folder named "data" automatically goes in git lfs (see .gitattributes file).
# Preview image is shown in "Overview" of Extensions window. Screenshot of an extension might be a good preview image.
preview_image = "data/icons/SectionTool.svg"

# Icon is shown in Extensions window, it is recommended to be square, of size 256x256.
icon = "data/icons/SectionTool.svg"

# Keywords for the extension
keywords = ["section", "tool"]

# Location of change log file in target (final) folder of extension, relative to the root.
# More info on writing changelog: https://keepachangelog.com/en/1.0.0/
changelog="docs/CHANGELOG.md"

[package.target]
kit = ["109.0.0"]  # Required for Event 2.0

[package.writeTarget]
kit = true

# We only depend on testing framework currently:
[dependencies]
"omni.ui" = {}
"omni.ui.scene" = {}
"omni.usd" = {}
"omni.kit.widget.settings" = {}
"omni.kit.widgets.custom" = {}
"omni.kit.viewport.utility" = {}
"omni.kit.window.cursor" = {}
"omni.kit.viewport.window" = {}
"omni.kit.menu.utils" = {}

# Main python module this extension provides, it will be publicly available as "import morph.hytwin_section".
[[python.module]]
name = "morph.hytwin_section"

[settings]
# Setting for "Always Display Section"
# On - section is always displayed
# Off(default)  - the sections is only displayed when the panel is open.
exts."morph.hytwin_section".alwaysDisplay = false
exts."morph.hytwin_section".useSessionLayer = true

exts."morph.hytwin_section".menuPath = "Tools/Section"

[documentation]
pages = ["docs/Overview.md", "docs/SETTINGS.md", "docs/CHANGELOG.md"]

[[test]]
args = [
]
dependencies = [
    "omni.kit.uiapp",
    "omni.kit.ui_test",
    "omni.hydra.rtx",
]
